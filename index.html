<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>綽貓喵公仔機 v3 - 可玩基準版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#160d17;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;overflow-x:hidden}
body{display:flex;justify-content:center;align-items:flex-start;padding:8px}
#game{position:relative;width:min(96vw,720px);aspect-ratio:3372/5056;touch-action:none;user-select:none}
#machine{position:absolute;inset:0;width:100%;height:100%;display:block}
#playfield{position:absolute;left:5.0%;top:20.4%;width:90.0%;height:45.8%;overflow:hidden;border-radius:1.5%}
#toys{position:absolute;inset:0;z-index:3}
.toy{position:absolute;transform-origin:center bottom;filter:drop-shadow(0 4px 5px rgba(80,20,50,.22));transition:transform .18s,opacity .18s;pointer-events:none}
.toy img{width:100%;height:100%;object-fit:contain;display:block}
#claw{position:absolute;z-index:12;width:27%;left:1.5%;top:4.0%;pointer-events:none;transition:left .06s linear,top .16s ease-out;will-change:left,top}
#claw img{width:100%;display:block}
#carriedToy{position:absolute;z-index:11;width:14%;display:none;pointer-events:none;transform:translate(-50%,0);filter:drop-shadow(0 6px 6px rgba(70,10,45,.22))}
#carriedToy img{width:100%;display:block}
#claw.carry{filter:drop-shadow(0 8px 8px rgba(60,10,40,.3))}
#dropZone{position:absolute;z-index:17;left:4.0%;top:73.0%;width:18%;height:13%;pointer-events:none}
#dropToy{position:absolute;width:65%;left:18%;bottom:5%;display:none}
#dropToy.show{display:block;animation:drop 1.25s ease-in forwards}
@keyframes drop{0%{transform:translateY(-15%) rotate(-8deg);opacity:1}45%{transform:translateY(25%) rotate(8deg);opacity:1}100%{transform:translateY(90%) rotate(16deg);opacity:0}}

/* Controls: moved to the Photoshop reference positions. */
#joystick{position:absolute;z-index:20;left:6.8%;top:61.8%;width:14.2%;height:13.8%;touch-action:none;cursor:grab}
#joystick:active{cursor:grabbing}
#joystick img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#joystickBase{z-index:0}
#joystickStick{z-index:1;transform-origin:50% 76%;transition:transform .08s}
#button{position:absolute;z-index:20;left:28.3%;top:66.7%;width:14.8%;height:8.9%;padding:0;border:0;background:transparent;cursor:pointer}
#button img{width:100%;height:100%;object-fit:contain;display:block}
#credit{position:absolute;z-index:22;left:51.6%;top:68.0%;width:15.9%;height:8.2%;display:flex;align-items:center;justify-content:center;color:#ff496b;font-weight:900;font-size:clamp(16px,3.2vw,28px);letter-spacing:.08em;text-shadow:0 0 8px rgba(255,50,100,.45);pointer-events:none}
#money{position:absolute;z-index:25;left:74.2%;top:71.9%;width:11.8%;cursor:pointer;transform:rotate(2deg);transition:transform .18s}
#money img{width:100%;display:block}
#money.insert{animation:insert .7s ease forwards}
@keyframes insert{0%{transform:translateY(0) rotate(2deg)}55%{transform:translateY(-8%) rotate(1deg)}100%{transform:translateY(-18%) scale(.72) rotate(0);opacity:0}}

#exitPrize{position:absolute;z-index:18;left:34%;top:82.2%;width:32%;height:9%;display:flex;align-items:center;justify-content:center;pointer-events:none}
#exitPrize .prize{width:31%;animation:pop .75s ease-out forwards;filter:drop-shadow(0 5px 5px rgba(70,10,45,.25))}
@keyframes pop{0%{transform:translateY(40%) scale(.3);opacity:0}60%{transform:translateY(-10%) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
#collectionBtn,#soundBtn{position:absolute;z-index:30;border:0;background:rgba(255,255,255,.78);color:#7a2c58;border-radius:999px;font-weight:800;box-shadow:0 3px 10px rgba(100,20,70,.18);cursor:pointer}
#collectionBtn{right:2.5%;top:2%;padding:.7em 1em;font-size:clamp(10px,1.8vw,14px)}
#soundBtn{left:2.5%;top:2%;padding:.55em .75em;font-size:clamp(10px,1.8vw,14px)}
#hint{position:absolute;z-index:29;left:50%;top:13%;transform:translateX(-50%);background:rgba(255,255,255,.86);padding:.45em .8em;border-radius:999px;color:#713052;font-weight:800;font-size:clamp(9px,1.6vw,12px);white-space:nowrap;opacity:0;transition:opacity .3s}
#hint.show{opacity:1}
#toast{position:fixed;left:50%;bottom:8%;transform:translateX(-50%) scale(.9);z-index:120;background:rgba(80,22,58,.94);color:white;padding:12px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#modal{position:fixed;inset:0;background:rgba(35,10,28,.62);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.panel{width:min(92vw,480px);background:linear-gradient(180deg,#fff8fc,#ffe9f5);border:4px solid #ef83b5;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);color:#6b2d50;text-align:center}
.panel h2{margin:0 0 8px;font-size:26px}
.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}
.card{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 12px rgba(100,30,70,.12)}
.card img{width:100%;height:100px;object-fit:contain}.card .name{font-weight:900;margin-top:5px}.card .status{font-size:12px;color:#b45b87}.card .qty{font-size:13px;color:#8c4168;font-weight:900;margin-top:3px}
.close{border:0;border-radius:999px;padding:10px 20px;background:#ed6fa8;color:white;font-weight:900;cursor:pointer}

#cable{
  position:absolute;
  z-index:10;
  top:0;
  width:1.1%;
  left:calc(15% - .55%);
  height:6%;
  border-radius:999px;
  background:linear-gradient(90deg,#6f6269,#eee,#8b747d,#f8e7ed,#6f6269);
  box-shadow:0 0 2px rgba(50,20,40,.35);
  pointer-events:none;
  transform-origin:top center;
  transition:left .06s linear,height .06s linear;
}
</style>
</head>
<body>
<div id="game">
<img id="machine" src="machine_base.png" alt="綽貓喵公仔機">
<button id="soundBtn" aria-label="音效">🔊</button>
<button id="collectionBtn">📖 收藏</button>
<div id="hint">投入 $500SC → 3 次機會｜拖住搖桿移動</div>
<div id="playfield">
<div id="cable"></div>
<div id="toys"></div>
<div id="carriedToy"><img id="carriedToyImg"></div>
<div id="claw"><img id="clawImg" src="claw_open.png"></div>
<div id="dropZone"><img id="dropToy"></div>
</div>
<div id="joystick"><img id="joystickBase" src="joystick_base.png"><img id="joystickStick" src="joystick_stick.png"></div>
<button id="button" aria-label="開始夾取"><img id="buttonImg" src="button_normal.png"></button>
<div id="credit">0</div>
<div id="money"><img src="money_500sc.png" alt="$500SC"></div>
<div id="exitPrize"></div>
</div>
<div id="toast"></div>
<div id="modal"><div class="panel"><h2>綽貓喵公仔收藏</h2><div id="collection" class="collection"></div><div id="count"></div><br><button class="close" id="closeModal">返回遊戲</button></div></div>
<script>
const TYPES=[
{id:"samon",name:"三文貓",img:"character_samon_cat.png",rarity:"普通",scale:.18},
{id:"onion",name:"蔥豬",img:"character_onion_pig.png",rarity:"稀有",scale:.19},
{id:"nose",name:"大鼻哥",img:"character_big_nose.png",rarity:"超稀有",scale:.17}
];
const savedCollection=JSON.parse(localStorage.getItem("cheukcat_collection_v3")||localStorage.getItem("cheukcat_collection_v2")||"{}");
Object.keys(savedCollection).forEach(k=>{savedCollection[k]=Number(savedCollection[k])||0});
const state={credits:0,clawX:15,clawY:4,busy:false,sound:true,collected:savedCollection};
const cable=document.getElementById("cable");
const playfield=document.getElementById("playfield"),toysEl=document.getElementById("toys"),claw=document.getElementById("claw"),clawImg=document.getElementById("clawImg"),carried=document.getElementById("carriedToy"),carriedImg=document.getElementById("carriedToyImg"),stick=document.getElementById("joystickStick"),credit=document.getElementById("credit"),money=document.getElementById("money"),button=document.getElementById("button"),buttonImg=document.getElementById("buttonImg"),dropToy=document.getElementById("dropToy"),exitPrize=document.getElementById("exitPrize"),toast=document.getElementById("toast"),joystick=document.getElementById("joystick");
const rand=(a,b)=>a+Math.random()*(b-a),wait=ms=>new Promise(r=>setTimeout(r,ms));
function chooseType(){let r=Math.random();return r<.58?TYPES[0]:r<.92?TYPES[1]:TYPES[2]}
function spawnToys(){
 toysEl.innerHTML="";const count=18;const rows=[4,5,5,4],ys=[51,60,69,78];
 rows.forEach((n,row)=>{const spacing=73/(n+1);for(let j=0;j<n;j++){
  const t=chooseType(),el=document.createElement("div");el.className="toy";el.dataset.id=t.id;
  const visualScale=rand(.92,1.08);
  el.style.width=(t.scale*100*visualScale)+"%";el.style.height=(t.scale*100*visualScale)+"%";
  const center=50,jitter=rand(-3.4,3.4),x=center+(j-(n-1)/2)*spacing+jitter;
  const y=ys[row]+rand(-2.1,2.1);
  el.style.left=Math.max(8,Math.min(78,x))+"%";
  el.style.top=y+"%";
  el.style.transform=`rotate(${rand(-16,16)}deg)`;
  el.style.zIndex=10+row;
  const img=document.createElement("img");img.src=t.img;img.alt=t.name;el.appendChild(img);toysEl.appendChild(el);
 }});
}
function updateCredit(){credit.textContent=state.credits}
function setClaw(){claw.style.left=(state.clawX-13.5)+"%";claw.style.top=state.clawY+"%";
      if(cable){cable.style.left=(state.clawX-0.55)+"%";cable.style.height=Math.max(1,state.clawY+2.2)+"%";}if(carried.style.display!=="none"){carried.style.left=state.clawX+"%";carried.style.top=(state.clawY+19)+"%"}}
function toastMsg(msg,ms=1500){toast.textContent=msg;toast.classList.add("show");clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>toast.classList.remove("show"),ms)}
function beep(freq=500,dur=.08){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=beep.ctx||(beep.ctx=new C()),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type="sine";g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch(e){}}
function moveJoystick(dx){if(state.busy||state.credits<=0)return;state.clawX=Math.max(15,Math.min(85,state.clawX+dx));setClaw();stick.style.transform=`rotate(${dx>0?18:-18}deg)`;clearTimeout(moveJoystick.t);moveJoystick.t=setTimeout(()=>stick.style.transform="rotate(0deg)",100)}
function nearestToy(){
 const fr=playfield.getBoundingClientRect(),cr=claw.getBoundingClientRect(),cx=(cr.left-fr.left)+cr.width/2,cy=(cr.top-fr.top)+cr.height*.72;let best=null,bestD=Infinity;
 document.querySelectorAll(".toy").forEach(el=>{if(el.dataset.removed)return;const r=el.getBoundingClientRect(),tx=r.left-fr.left+r.width/2,ty=r.top-fr.top+r.height*.34,d=Math.hypot(tx-cx,ty-cy);if(d<bestD){bestD=d;best=el}});
 return {el:best,d:bestD};
}
function removeToy(el){if(!el)return;el.dataset.removed="1";el.style.opacity="0";setTimeout(()=>el.remove(),220)}
function setCollected(id){state.collected[id]=(Number(state.collected[id])||0)+1;localStorage.setItem("cheukcat_collection_v3",JSON.stringify(state.collected))}
function award(t){setCollected(t.id);exitPrize.innerHTML=`<img class="prize" src="${t.img}" alt="${t.name}">`;toastMsg(`🎉 ${t.name} GET！${t.id==="nose"?"⭐ 超稀有！":""}`,2200);beep(t.id==="nose"?900:650,.18);setTimeout(()=>exitPrize.innerHTML="",2100)}
async function moveClawTo(x,y,duration){const sx=state.clawX,sy=state.clawY,steps=Math.max(1,Math.round(duration/30));for(let i=1;i<=steps;i++){await wait(duration/steps);const p=i/steps;state.clawX=sx+(x-sx)*p;state.clawY=sy+(y-sy)*p;setClaw()}}
async function tryClaw(){
 if(state.busy||state.credits<=0)return;state.busy=true;state.credits--;updateCredit();buttonImg.src="button_pressed.png";beep(330,.08);
 const target=nearestToy();if(!target.el){state.busy=false;buttonImg.src="button_normal.png";return}
 const tr=target.el.getBoundingClientRect(),fr=playfield.getBoundingClientRect();
 const targetX=((tr.left-fr.left+tr.width/2)/fr.width)*100;
 const targetY=Math.max(18,Math.min(58,((tr.top-fr.top)/fr.height)*100+4));
 const horizontalGap=Math.abs(targetX-state.clawX),aligned=horizontalGap<=11;
 await moveClawTo(state.clawX,targetY,1500);
 clawImg.src="claw_closed.png";await wait(420);
 const chance=aligned?(target.el.dataset.id==="nose"?.52:.84):0;
 if(aligned&&Math.random()<chance){
   const type=TYPES.find(x=>x.id===target.el.dataset.id);removeToy(target.el);
   carriedImg.src=type.img;carried.style.display="block";setClaw();claw.classList.add("carry");
   await moveClawTo(state.clawX,7,1300);await moveClawTo(15,7,1900);
   clawImg.src="claw_open.png";await wait(420);carried.style.display="none";claw.classList.remove("carry");
   dropToy.src=type.img;dropToy.style.display="block";dropToy.classList.remove("show");void dropToy.offsetWidth;dropToy.classList.add("show");
   await wait(1250);dropToy.style.display="none";award(type);
   if(toysEl.querySelectorAll(".toy").length===0){await wait(500);spawnToys();toastMsg("🧸 公仔補充完成！繼續挑戰吧～",1500)}
 }else{clawImg.src="claw_open.png";await wait(220);toastMsg(aligned?"抓到了！但滑掉了～":"爪子還差一點，再慢慢對準～",1300);beep(240,.10)}
 await moveClawTo(15,4,1100);buttonImg.src="button_normal.png";state.busy=false;
 if(state.credits===0)toastMsg("本次 3 次機會用完！再投入 $500SC 試試吧～",2200);
}
let joyActive=false,joyPointerX=0,joyTimer=null;
function joyLoop(){if(!joyActive||state.busy||state.credits<=0)return;const r=joystick.getBoundingClientRect(),center=r.left+r.width/2,dx=joyPointerX-center,step=Math.max(-0.55,Math.min(0.55,dx/r.width*1.25));if(Math.abs(dx)>4)moveJoystick(step)}
joystick.addEventListener("pointerdown",e=>{if(state.busy||state.credits<=0)return;e.preventDefault();joyActive=true;joyPointerX=e.clientX;joystick.setPointerCapture?.(e.pointerId);clearInterval(joyTimer);joyTimer=setInterval(joyLoop,35)});
joystick.addEventListener("pointermove",e=>{if(!joyActive)return;e.preventDefault();joyPointerX=e.clientX;joyLoop()});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>joystick.addEventListener(ev,e=>{joyActive=false;clearInterval(joyTimer);joyTimer=null;stick.style.transform="rotate(0deg)"}));
button.addEventListener("pointerdown",e=>{e.preventDefault();tryClaw()});
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){e.preventDefault();moveJoystick(-0.8)}if(e.key==="ArrowRight"){e.preventDefault();moveJoystick(0.8)}if(e.key===" "){e.preventDefault();tryClaw()}});
money.addEventListener("click",()=>{if(state.busy)return;if(state.credits>0){toastMsg("還有機會喔！先用完目前的 CREDIT～");return}money.classList.remove("insert");void money.offsetWidth;money.classList.add("insert");state.credits=3;updateCredit();beep(520,.12);setTimeout(()=>money.style.opacity="0",650);setTimeout(()=>{money.style.opacity="1";money.classList.remove("insert")},1100);toastMsg("💵 $500SC 投入成功！3 次機會！",1700)});
document.getElementById("soundBtn").addEventListener("click",e=>{state.sound=!state.sound;e.currentTarget.textContent=state.sound?"🔊":"🔇"});
document.getElementById("collectionBtn").addEventListener("click",()=>{const c=document.getElementById("collection");c.innerHTML=TYPES.map(t=>{const n=Number(state.collected[t.id])||0;return `<div class="card"><img src="${t.img}" alt="${t.name}"><div class="name">${n?"✓ ":"🔒 "}${t.name}</div><div class="status">${n?t.rarity:"尚未取得"}</div><div class="qty">已夾到：${n} 隻</div></div>`}).join("");const total=TYPES.reduce((a,t)=>a+(Number(state.collected[t.id])||0),0),kinds=TYPES.filter(t=>(Number(state.collected[t.id])||0)>0).length;document.getElementById("count").textContent=`收藏種類：${kinds} / ${TYPES.length}　｜　總共夾到：${total} 隻`;document.getElementById("modal").classList.add("show")});
document.getElementById("closeModal").addEventListener("click",()=>document.getElementById("modal").classList.remove("show"));
spawnToys();updateCredit();setClaw();setTimeout(()=>document.getElementById("hint").classList.add("show"),400);setTimeout(()=>document.getElementById("hint").classList.remove("show"),3800);
</script>
</body>
</html>
